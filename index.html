<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>每日值日生自動輪播系統</title>
  <link rel="stylesheet" href="style.css?v=1.0.3">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📅 每日值日生輪播系統</h1>
      <p class="subtitle">自動計算工作日值班人員，支援預覽當月與下個月名單</p>
    </header>

    <!-- Today's Duty Banner -->
    <section class="card hero-card">
      <div class="card-tag">今日值日生</div>
      <div class="today-date" id="today-date-display">載入中...</div>
      <div class="duty-members" id="today-duty-display">
        <span class="loading">正在計算值日生名單...</span>
      </div>
      <div class="status-note" id="today-status-note"></div>
    </section>

    <!-- Notification Settings Card -->
    <section class="card notification-card">
      <div class="notification-content">
        <div class="notification-text">
          <strong>🔔 每日 11:30 值日生推播提醒</strong>
          <p class="notification-desc">開啟後，於有值班人員的工作日早上 11:30 自動發送提醒通知。</p>
        </div>
        <div class="notification-actions">
          <button id="btn-test-notification" class="btn-secondary btn-sm hidden">測試推播</button>
          <label class="switch">
            <input type="checkbox" id="notification-toggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div id="notification-status-msg" class="notification-status-msg"></div>
    </section>

    <!-- Date Lookup / Filter -->
    <section class="card controls-card">
      <div class="control-group">
        <label for="month-select">🗓️ 選擇查看月份：</label>
        <input type="month" id="month-select">
      </div>
      <div class="control-group">
        <label for="specific-date">🔍 查詢特定日期：</label>
        <input type="date" id="specific-date">
        <button id="btn-search-date" class="btn-primary">查詢</button>
      </div>
    </section>

    <!-- Search Result Modal or Alert (if specific date queried) -->
    <div id="search-result-box" class="search-result-box hidden"></div>

    <!-- Monthly Schedule Table -->
    <section class="card table-card">
      <div class="table-header">
        <h2 id="table-title">值日生輪換表</h2>
        <div class="btn-group">
          <button id="btn-prev-month" class="btn-secondary">◀ 上個月</button>
          <button id="btn-this-month" class="btn-secondary">本月</button>
          <button id="btn-next-month" class="btn-secondary">下個月 ▶</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="schedule-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>星期</th>
              <th>值班類型</th>
              <th>值日生人員</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
      <div class="table-footer-controls">
        <div class="btn-group">
          <button id="btn-prev-month-bottom" class="btn-secondary">◀ 上個月</button>
          <button id="btn-this-month-bottom" class="btn-secondary">本月</button>
          <button id="btn-next-month-bottom" class="btn-secondary">下個月 ▶</button>
        </div>
      </div>
    </section>

    <footer class="footer"></footer>
  </div>

  <script src="app.js?v=1.0.3"></script>
</body>
</html>
